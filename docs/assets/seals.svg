<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
  <!-- ========================================================
       NARUTO SHINOBI 12 ZODIAC SEALS — HIGH-FIDELITY LINE ART
       ======================================================== -->

  <!-- 1. PÁJARO (TORI) - 酉 -->
  <symbol id="seal-tori" viewBox="0 0 48 48">
    <!-- Puntas de pulgares y meñiques en flecha/aguja arriba -->
    <path d="M24 5 L20 16 L12 28 L14 41 L20 43" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M24 5 L28 16 L36 28 L34 41 L28 43" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Línea central de unión de dedos erguidos -->
    <line x1="24" y1="5" x2="24" y2="20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    <!-- Dedos centrales plegados hacia el centro formando triángulo interior -->
    <path d="M20 20 L24 25 L28 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M18 24 L24 30 L30 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M16 28 L24 35 L32 28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Placas protectoras de los guantes shinobi -->
    <rect x="10" y="30" width="6" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.65" />
    <rect x="32" y="30" width="6" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.65" />
    <!-- Muñecas/antebrazos -->
    <line x1="14" y1="41" x2="6" y2="44" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="34" y1="41" x2="42" y2="44" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 2. JABALÍ (I) - 亥 -->
  <symbol id="seal-i" viewBox="0 0 48 48">
    <!-- Puño izquierdo: muñeca arriba, nudillos abajo -->
    <path d="M14 8 L19 14 L19 36 C19 39 16 41 13 39 L10 35 L10 14 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Puño derecho: muñeca arriba, nudillos abajo -->
    <path d="M34 8 L29 14 L29 36 C29 39 32 41 35 39 L38 35 L38 14 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Nudillos horizontales enfrentados -->
    <line x1="19" y1="20" x2="29" y2="20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <line x1="19" y1="26" x2="29" y2="26" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <line x1="19" y1="32" x2="29" y2="32" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <!-- Placas de metal laterales -->
    <rect x="11" y="16" width="5" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <rect x="32" y="16" width="5" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <!-- Curvatura de pulgares replegados -->
    <path d="M10 24 C8 26 8 30 10 32" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <path d="M38 24 C40 26 40 30 38 32" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" />
  </symbol>

  <!-- 3. PERRO (INU) - 戌 -->
  <symbol id="seal-inu" viewBox="0 0 48 48">
    <!-- Mano superior: palma extendida plana horizontal -->
    <path d="M8 17 L38 17 C41 17 43 19 41 22 L37 24 L8 24 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Separación de dedos horizontales -->
    <line x1="18" y1="17" x2="18" y2="24" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <line x1="26" y1="17" x2="26" y2="24" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <line x1="33" y1="17" x2="33" y2="24" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <!-- Placa de guante mano superior -->
    <rect x="14" y="13" width="14" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7" />
    <!-- Mano inferior: puño cerrado apoyado debajo -->
    <path d="M12 25 L34 25 C37 25 38 28 36 36 C34 41 29 42 16 42 L12 38 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dedos del puño inferior -->
    <path d="M18 29 L18 39 M24 29 L24 39 M30 29 L30 38" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity="0.65" />
    <!-- Muñecas laterales -->
    <line x1="8" y1="21" x2="4" y2="21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="12" y1="36" x2="6" y2="38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 4. DRAGÓN (TATSU) - 辰 -->
  <symbol id="seal-tatsu" viewBox="0 0 48 48">
    <!-- Pulgares erguidos arriba -->
    <path d="M22 6 L22 15 M26 6 L26 15" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" />
    <!-- Rombo / caja exterior de los dedos entrelazados -->
    <path d="M24 14 L11 25 L24 43 L37 25 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Entrelazado interno de nudillos a 90 grados -->
    <line x1="18" y1="20" x2="30" y2="20" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <line x1="15" y1="25" x2="33" y2="25" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <line x1="18" y1="30" x2="30" y2="30" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <line x1="21" y1="35" x2="27" y2="35" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <!-- Meñiques apuntando hacia abajo en la base -->
    <line x1="24" y1="38" x2="24" y2="45" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    <!-- Muñecas que entran a los lados -->
    <line x1="11" y1="25" x2="5" y2="25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="37" y1="25" x2="43" y2="25" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 5. LIEBRE (U) - 卯 -->
  <symbol id="seal-u" viewBox="0 0 48 48">
    <!-- Mano en forma de pistola: pulgar erguido a 90° -->
    <path d="M21 7 L25 7 C26 7 27 9 27 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Índice apuntando recto hacia la derecha -->
    <path d="M27 18 L41 18 C43 18 44 20 43 23 L39 25 L27 25" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Nudillos plegados del puño de la mano pistola -->
    <path d="M27 25 L27 36 C27 39 24 40 20 39 L16 37 L16 19 C16 12 18 7 21 7 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Mano de apoyo debajo sosteniendo el puño -->
    <path d="M14 28 L14 42 C14 44 19 45 28 42 L32 39" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Separación de dedos en puño -->
    <line x1="21" y1="28" x2="27" y2="28" stroke="currentColor" stroke-width="1.3" opacity="0.65" />
    <line x1="20" y1="33" x2="27" y2="33" stroke="currentColor" stroke-width="1.3" opacity="0.65" />
    <!-- Placa de metal del guante -->
    <rect x="8" y="22" width="6" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <line x1="8" y1="27" x2="4" y2="27" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 6. CABALLO (UMA) - 午 -->
  <symbol id="seal-uma" viewBox="0 0 48 48">
    <!-- Tienda / tejado triangular formado por los dedos índices -->
    <path d="M24 7 L16 23 L11 36 L17 38 L21 28 L24 19 L27 28 L31 38 L37 36 L32 23 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Punto de contacto de las yemas superiores -->
    <circle cx="24" cy="7" r="1.5" fill="currentColor" />
    <!-- Dedos cruzados horizontalmente en la base -->
    <line x1="19" y1="28" x2="29" y2="28" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <line x1="18" y1="33" x2="30" y2="33" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <!-- Placas de metal en los dorsos exteriores -->
    <rect x="8" y="27" width="5" height="9" rx="1" transform="rotate(-15 10 31)" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.65" />
    <rect x="35" y="27" width="5" height="9" rx="1" transform="rotate(15 37 31)" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.65" />
    <!-- Antebrazos -->
    <line x1="11" y1="36" x2="5" y2="40" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="37" y1="36" x2="43" y2="40" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 7. MONO (SARU) - 申 -->
  <symbol id="seal-saru" viewBox="0 0 48 48">
    <!-- Mano superior: dedos planos extendidos hacia la derecha -->
    <path d="M8 16 L40 16 C42 16 43 18 41 21 L37 22 L8 22 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="18" y1="16" x2="18" y2="22" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <line x1="26" y1="16" x2="26" y2="22" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <line x1="34" y1="16" x2="34" y2="22" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <!-- Mano inferior: dedos planos extendidos paralelos debajo -->
    <path d="M10 26 L38 26 C40 26 41 28 39 31 L35 32 L10 32 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="19" y1="26" x2="19" y2="32" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <line x1="27" y1="26" x2="27" y2="32" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <!-- Pulgares replegados lateralmente -->
    <path d="M8 22 C6 24 6 28 10 30" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
    <!-- Placa de guante -->
    <rect x="12" y="11" width="14" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.7" />
    <!-- Base inferior y muñecas -->
    <path d="M12 32 L12 40 C12 42 22 43 30 40 L34 36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="8" y1="19" x2="4" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="10" y1="36" x2="5" y2="38" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 8. BUEY (USHI) - 丑 -->
  <symbol id="seal-ushi" viewBox="0 0 48 48">
    <!-- Dos dedos índices/medios cruzados verticalmente como cuernos -->
    <path d="M21 7 L21 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    <path d="M27 9 L27 24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="21" cy="7" r="1.2" fill="currentColor" />
    <circle cx="27" cy="9" r="1.2" fill="currentColor" />
    <!-- Mano horizontal inferior que cruza en ángulo recto -->
    <path d="M8 24 L38 24 C41 24 42 26 40 29 L36 31 L8 31 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Líneas de dedos horizontales -->
    <line x1="18" y1="24" x2="18" y2="31" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <line x1="26" y1="24" x2="26" y2="31" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <line x1="33" y1="24" x2="33" y2="31" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <!-- Base y puño vertical que baja -->
    <path d="M22 31 L22 42 C22 44 28 44 28 42 L28 31" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    <!-- Antebrazos -->
    <line x1="8" y1="28" x2="4" y2="28" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="25" y1="42" x2="25" y2="46" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 9. CARNERO (HITSUJI) - 未 -->
  <symbol id="seal-hitsuji" viewBox="0 0 48 48">
    <!-- Dos dedos índice y medio gemelos erguidos juntos verticalmente -->
    <path d="M21 5 L21 22 C21 23 23 23 23 22 L23 5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25 5 L25 22 C25 23 27 23 27 5 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Unión de las dos manos debajo de los dedos rectos -->
    <path d="M15 22 L33 22 C36 22 38 25 36 34 C34 40 28 42 20 42 C14 42 12 37 14 30 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Nudillos y pulgares entrelazados en la base -->
    <path d="M17 26 C21 28 27 28 31 26" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <path d="M17 31 C21 33 27 33 31 31" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <path d="M18 36 C22 38 26 38 30 36" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <!-- Placa de metal del guante izquierdo -->
    <rect x="10" y="27" width="4" height="9" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.65" />
    <!-- Muñecas laterales -->
    <line x1="13" y1="38" x2="6" y2="41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="33" y1="38" x2="40" y2="41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 10. RATA (NE) - 子 -->
  <symbol id="seal-ne" viewBox="0 0 48 48">
    <!-- Dos dedos de la mano derecha erguidos hacia arriba -->
    <path d="M22 6 L22 20 M26 7 L26 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="22" cy="6" r="1.2" fill="currentColor" />
    <circle cx="26" cy="7" r="1.2" fill="currentColor" />
    <!-- Mano izquierda envuelve firmemente los dedos como un cilindro/puño -->
    <path d="M15 20 L33 20 C36 20 38 23 37 34 C35 40 30 42 19 42 C13 42 12 36 14 28 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulgar de la mano envolvente cruzado al frente -->
    <path d="M16 23 C22 25 30 25 34 23" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" />
    <path d="M16 29 C22 31 30 31 34 29" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <path d="M17 35 C22 37 29 37 33 35" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" />
    <!-- Muñeca vertical que baja y mano envolvente lateral -->
    <line x1="24" y1="42" x2="24" y2="46" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="14" y1="28" x2="8" y2="30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 11. SERPIENTE (MI) - 巳 -->
  <symbol id="seal-mi" viewBox="0 0 48 48">
    <!-- Plegaria entrelazada: pulgares rectos juntos arriba -->
    <path d="M22 8 L22 17 M26 8 L26 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="22" cy="8" r="1.2" fill="currentColor" />
    <circle cx="26" cy="8" r="1.2" fill="currentColor" />
    <!-- Silueta compacta de ambas manos entrelazadas -->
    <path d="M24 16 L14 24 L13 38 L24 43 L35 38 L34 24 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dedos fuertemente entrelazados en X / zig-zag -->
    <path d="M17 21 L31 30 M31 21 L17 30" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <path d="M16 28 L32 37 M32 28 L16 37" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
    <!-- Placas protectoras a ambos costados -->
    <rect x="8" y="27" width="4" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <rect x="36" y="27" width="4" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <!-- Muñecas entrando abajo -->
    <line x1="15" y1="40" x2="8" y2="43" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="33" y1="40" x2="40" y2="43" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>

  <!-- 12. TIGRE (TORA) - 寅 -->
  <symbol id="seal-tora" viewBox="0 0 48 48">
    <!-- Dos dedos índices rectos juntos apuntando verticalmente al cielo -->
    <path d="M22 4 L22 23 C22 24 23 24 24 24 C25 24 26 24 26 23 L26 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="22" cy="4" r="1.1" fill="currentColor" />
    <circle cx="26" cy="4" r="1.1" fill="currentColor" />
    <line x1="24" y1="4" x2="24" y2="23" stroke="currentColor" stroke-width="1.2" opacity="0.6" />
    <!-- Cuerpo de ambas manos entrelazadas en puño firme -->
    <path d="M15 23 L33 23 C36 23 38 26 36 36 C34 42 28 44 20 44 C13 44 12 38 14 30 Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Entrelazado de los dedos medio, anular y meñique -->
    <path d="M16 27 C21 29 27 29 32 27" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <path d="M16 32 C21 34 27 34 32 32" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <path d="M17 37 C21 39 27 39 31 37" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" />
    <!-- Pulgares replegados contra la base del sello -->
    <path d="M19 39 C22 41 26 41 29 39" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.75" />
    <!-- Muñecas/antebrazos laterales -->
    <line x1="13" y1="39" x2="6" y2="43" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
    <line x1="33" y1="39" x2="40" y2="43" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </symbol>
</svg>
